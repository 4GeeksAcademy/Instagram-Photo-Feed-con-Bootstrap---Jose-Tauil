<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Feed</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<style>
  body {
    background: #f5f5f5;
  }

  .grid-img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
  }
</style>
</head>

<body>

  <nav class="navbar bg-white shadow-sm">
    <div class="container d-flex justify-content-between">

      <span class="navbar-brand fw-bold">
        <i class="bi bi-instagram"></i> Instagram
      </span>

      <div class="d-flex gap-2">

        <div class="dropdown">
          <button class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
            Create post
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#postModal">
                Create a new post
              </a>
            </li>
          </ul>
        </div>

        <div class="dropdown">
          <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-gear"></i>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li><a class="dropdown-item" href="#">Accesibillity</a></li>
            <li><a class="dropdown-item" href="#">Privacy and</a></li>
            <li><a class="dropdown-item" href="#">Log</a></li>
          </ul>
        </div>

      </div>

    </div>
  </nav>

  <div class="text-center mt-4">
    <a href="./grid.html" class="btn btn-light me-2">
      Grid <i class="bi bi-grid-3x3"></i>
    </a>

    <a href="./feed.html" class="btn btn-light">
      Feed <i class="bi bi-square-fill"></i>
    </a>
  </div>

  <div class="container-fluid px-1 mt-3">
    <div class="row g-1">

      <div class="col-12"><img src="https://picsum.photos/300" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/400" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/678" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/345" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/456" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/553" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/666" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/555" class="grid-img"></div>
      <div class="col-12"><img src="https://picsum.photos/321" class="grid-img"></div>

    </div>
  </div>

  <div class="modal fade" id="postModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Create a new post</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <textarea class="form-control" placeholder="Escribe algo..."></textarea>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button class="btn btn-success">Publicar</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
