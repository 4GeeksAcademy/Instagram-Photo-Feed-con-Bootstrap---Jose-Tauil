<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Feed</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>

<style>

  body{
    background: #f5f5f5;;
  }

  .grid-img{
    width: 100%;
    height: 250px;
    object-fit: cover;
  }
</style>

<body>




<nav class="navbar bg-white shadow-sm">
  <div class="container d-flex justify-content-between">
    
    <span class="navbar-brand fw-bold">
      <i class="bi bi-instagram"></i> Instagram
    </span>

    <button class="btn btn-success">
      Create post</button>
    </div>
</nav>

<div class="text-center mt-4">
 <a href="./grid.html" class="btn btn-light me-2">Grid
    <i class="bi bi-grid-3x3"></i>
 </a>

   <a href="./feed.html" class="btn btn-light">Feed
    <i class="bi bi-square-fill"></i>
  </a>
</div>

<div class="container mt-4">
  <div class="row g-2">

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/300" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/400" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/678" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/345" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/456" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/553" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/666" class="grid-img">
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/555" class="grid-img">
    </div>

     <div class="col-12 col-md-6 col-lg-4">
      <img src="https://picsum.photos/321" class="grid-img">
    </div>


  </div>
</div>

<hr class="my-5">
<div class="container">
  <div class="col-12 col-md-8 col-lg-6 mx-auto">

    <div class="card mt-4 shadow-sm">

      <div class="card-header d-flex justify-content-between">
        <span>My first photo</span>
        <span>02/06</span>
      </div>

      <img src="https://picsum.photos/670" class="card-img-top">

      <div class="card-body">
        <p><strong>204 Likes</strong></p>
        <p>This is my first Instagram photo.</p>
      </div>
    </div>

    <div class="card mt-4">
       <div class="card-header d-flex justify-content-between">
        <span>Another day</span>
        <span>02/07</span>
      </div>

      <img src="https://picsum.photos/501" class="card-img-top">

       <div class="card-body">
        <p><strong>120 Likes</strong></p>
        <p>Enjoying the sunshine today.</p>

      </div>

    </div>


  </div>
</div>

</html>
